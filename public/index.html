<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 信息源</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local AI Source</p>
          <h1>AI 信息源</h1>
        </div>
        <div class="status" id="status">待刷新</div>
      </header>

      <section class="controls" aria-label="筛选">
        <div class="segmented" role="tablist" aria-label="信息流">
          <button class="segment active" data-view="selected">精选</button>
          <button class="segment" data-view="all">全部</button>
          <button class="segment" data-view="daily">日报</button>
        </div>

        <div class="field">
          <label for="category">分类</label>
          <select id="category">
            <option value="">全部分类</option>
            <option value="ai-models">模型发布</option>
            <option value="ai-products">产品发布</option>
            <option value="industry">行业动态</option>
            <option value="paper">论文研究</option>
            <option value="tip">技巧观点</option>
          </select>
        </div>

        <div class="field">
          <label for="hours">时间</label>
          <select id="hours">
            <option value="24">24 小时</option>
            <option value="72">3 天</option>
            <option value="168">7 天</option>
          </select>
        </div>

        <div class="field search">
          <label for="keyword">关键词</label>
          <input id="keyword" type="search" placeholder="OpenAI / Agent / RAG" />
        </div>

        <div class="actions">
          <button id="refresh" class="primary">刷新</button>
          <button id="push" class="secondary">推送飞书</button>
        </div>
      </section>

      <section class="summary-row" aria-label="概览">
        <div class="metric">
          <span id="metric-count">0</span>
          <small>条目</small>
        </div>
        <div class="metric">
          <span id="metric-source">AIHOT</span>
          <small>上游</small>
        </div>
        <a class="rss-link" id="rss-link" href="/feed.xml" target="_blank" rel="noreferrer">RSS</a>
      </section>

      <section id="content" class="content" aria-live="polite"></section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
